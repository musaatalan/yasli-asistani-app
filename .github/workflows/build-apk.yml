name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Local EAS Android APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK locally with EAS
        id: eas_build
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          APK_NAME="YasliAsistani-v${VERSION}-${SHORT_SHA}.apk"

          echo "Starting local EAS Android preview build (avoids Expo cloud quota)..."
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "./${APK_NAME}"

          if [ ! -f "./${APK_NAME}" ]; then
            echo "::error::APK not found at ./${APK_NAME}"
            ls -la .
            exit 1
          fi

          ls -lh "./${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: APK Build #${{ github.run_number }}
          body: |
            Otomatik yerel EAS preview APK çıktısı.

            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Profil:** `preview` (local)
            - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Bu release GitHub Actions tarafından oluşturulmuştur.
          files: ${{ steps.eas_build.outputs.apk_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
