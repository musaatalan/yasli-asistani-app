name: Build APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: EAS Android APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS
        id: eas_build
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Starting EAS Android preview build..."
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

          echo "EAS build JSON:"
          cat eas-build.json

          APK_URL="$(node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("eas-build.json", "utf8");
            const data = JSON.parse(raw);
            const build = Array.isArray(data) ? data[0] : data;
            if (!build) {
              console.error("Empty EAS build response");
              process.exit(1);
            }
            const url =
              build?.artifacts?.applicationArchiveUrl ||
              build?.artifacts?.buildUrl ||
              build?.applicationArchiveUrl ||
              "";
            if (!url) {
              console.error("No APK URL in EAS response");
              console.error(JSON.stringify(build, null, 2));
              process.exit(1);
            }
            process.stdout.write(url);
          ')"

          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "Downloaded artifact URL resolved."

      - name: Download APK
        id: download
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          APK_NAME="YasliAsistani-v${VERSION}-${SHORT_SHA}.apk"

          curl --fail --location --retry 3 \
            --output "${APK_NAME}" \
            "${{ steps.eas_build.outputs.apk_url }}"

          ls -lh "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: APK Build #${{ github.run_number }}
          body: |
            Otomatik EAS preview APK çıktısı.

            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Profil:** `preview`
            - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Bu release GitHub Actions tarafından oluşturulmuştur.
          files: ${{ steps.download.outputs.apk_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
